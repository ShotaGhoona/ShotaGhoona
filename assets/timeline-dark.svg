<svg xmlns="http://www.w3.org/2000/svg" width="840" height="332" viewBox="0 0 840 332">
  <style>
    .bg { fill:#0d1117; }
    .title { font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif; letter-spacing:.32em; fill:#e3b341; }
    .cmd { font:400 12.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; fill:#7d8590; }
    .mono { font:400 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; fill:#e6edf3; }
    .hash { fill:#e3b341; }
    .date { fill:#7d8590; }
    .lane { stroke:#30363d; stroke-width:2; fill:none; stroke-dasharray:400; stroke-dashoffset:400;
             animation:draw 2.4s .2s ease-in-out forwards; }
    .lane2 { stroke:#e3b341; stroke-opacity:.5; stroke-width:2; fill:none; stroke-dasharray:200; stroke-dashoffset:200;
              animation:draw 1.2s 1.4s ease-in-out forwards; }
    .node { fill:#0d1117; stroke:#7d8590; stroke-width:2; }
    .head { fill:#e3b341; }
    .c { opacity:0; animation:in .5s ease-out forwards; }
    .typing { font:400 12.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; fill:#7d8590; }
    .cur { fill:#e3b341; animation:blink 1.06s steps(1) infinite; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes in { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:none; } }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration:0s !important; animation-delay:0s !important; } }
  </style>
  <rect class="bg" width="840" height="332" rx="12"/>
